# Builds the desktop installers on every version tag (v1.2.3). Each platform builds in parallel;
# then one job creates the draft GitHub Release with everything attached at once, so a draft never
# appears with only some of the installers. Review the draft, then publish it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag must match package.json version");'
      - run: npm test
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          # Unsigned builds by default. Add signing secrets (CSC_LINK / CSC_KEY_PASSWORD, Apple
          # notarization) when you have certificates; see the electron-builder code-signing docs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build quick-update bundle
        # Code-only update for installs already on this Electron + libraries (the launcher swaps it
        # in without running the installer). Platform-independent, so one job makes it.
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/app-bundle.mjs
      - name: Collect release files
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release-assets
          cd dist
          for f in *.exe *.dmg *.zip *.AppImage *.blockmap latest*.yml app-update.json *-app.json.gz; do cp "$f" ../release-assets/; done
          ls -la ../release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach everything to the draft release
        run: node scripts/upload-release.mjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
